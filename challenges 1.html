<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 Challenge - 5 HTML Tags</title>
</head>
<body>
    <!-- 1. Heading Tag -->
    <h1>Welcome to Day 1 Challenge</h1>
    
    <!-- 2. Paragraph Tag -->
    <p>Today I practiced using at least five distinct HTML tags to build structured content.</p>
    
    <!-- 3. Unordered List Tag -->
    <ul>
        <li>HTML Tag 1: &lt;h1&gt;</li>
        <li>HTML Tag 2: &lt;p&gt;</li>
        <li>HTML Tag 3: &lt;ul&gt; / &lt;li&gt;</li>
    </ul>

    <!-- 4. Anchor / Link Tag -->
    <p>Check out <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a> for more info.</p>

    <!-- 5. Image Tag -->
    <div>
        <img src="https://placehold.co/300x200" alt="Placeholder image for Day 1 challenge">
    </div>
</body>
</html>
